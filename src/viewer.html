<!doctype html><html><head><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;height:100%;background:#9ec7e8}canvas{display:block}</style></head><body>
<!--THREE--><!--MODELS-->
<script>
const names=Object.keys(MODELS);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7e8);
scene.add(new THREE.HemisphereLight(0xcfe8ff,0x8a9a6a,0.9));
const sun=new THREE.DirectionalLight(0xfff1d6,1.6);sun.position.set(-6,10,5);sun.castShadow=true;sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x6fa04a}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.01;ground.receiveShadow=true;scene.add(ground);
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,100);cam.position.set(0,9,9);cam.lookAt(0,0,0);
const mgr=new THREE.LoadingManager();mgr.setURLModifier(u=>/colormap\.png$/.test(u)?COLORMAP:u);const loader=new THREE.GLTFLoader(mgr);function parseGLB(buf,ok,err){const c=window.createImageBitmap;window.createImageBitmap=undefined;try{loader.parse(buf,'',ok,err)}finally{window.createImageBitmap=c}}
function b64(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
let n=0;const cols=5;
names.forEach((nm,i)=>{parseGLB(b64(MODELS[nm]),g=>{const o=g.scene;o.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true}});
 o.position.set((i%cols-2)*1.6,0,(Math.floor(i/cols)-1)*1.6);scene.add(o);console.log(nm);if(++n===names.length){renderer.render(scene,cam);window.DONE=true}},e=>console.log('ERR',nm,e))});
</script></body></html>
