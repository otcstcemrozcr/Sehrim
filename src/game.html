<title>Şehrim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Düzen: tam ekran 3D sahne; üstte durum şeridi, solda araç paleti, altta ışık paneli.
   Görünüm: otoyol tabelası dili. Asfalt gri paneller, yol çizgisi sarısı vurgu. */
:root{
  --asphalt:#24282d;
  --asphalt-2:#30353b;
  --asphalt-line:#464c54;
  --curb:#dfe3ec;
  --curb-dim:#a3abb8;
  --paint:#ffc83d;
  --paint-ink:#2a2200;
  --ok:#62d48b;
  --bad:#ff6f61;
  --sky:#8ec9f2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--curb);font-family:var(--body);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sky)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.panel{background:rgba(36,40,45,.9);border:1px solid var(--asphalt-line);border-radius:6px;
  box-shadow:0 4px 18px rgba(8,12,20,.28)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--paint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#topbar{position:absolute;top:12px;left:var(--gl);right:var(--gr);display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;
  pointer-events:none}
#topbar>*{pointer-events:auto}
.stat{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;min-width:62px}
.stat small{font:600 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--curb-dim)}
.stat b{font:700 22px/1.1 var(--display);letter-spacing:.02em;margin-top:2px}
.stat.money b{color:var(--paint)}
.brand{color:var(--paint);font-weight:700}
#loading .brand{font:700 54px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.stat.lowpow b{color:var(--bad)}
#sndVol{width:70px}
#nameBox{padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
#nameBox small{font:600 11px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--curb-dim)}
#cityName{background:transparent;border:0;color:var(--curb);font:700 22px/1.1 var(--display);width:9ch;padding:0;margin-top:2px;
  -webkit-user-select:text;user-select:text}
#cityName::placeholder{color:var(--curb-dim)}
.spacer{flex:1}
.btn{background:var(--asphalt-2);border:1px solid var(--asphalt-line);border-radius:5px;padding:8px 14px;
  font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.btn:hover{background:#3a4047}
.btn.primary{background:var(--paint);border-color:var(--paint);color:var(--paint-ink)}
.btn.primary:hover{background:#ffd566}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#2b0904}
.btn.on{border-color:var(--paint);color:var(--paint)}
.btnrow{display:flex;gap:8px;align-items:stretch;padding:6px}
.btnrow{margin-left:auto}
@media (max-width:1500px){.stat.opt{display:none}#saveNote{display:none}#topbar{gap:8px}.stat{padding:6px 10px;min-width:56px}}
#saveNote{align-self:center;color:var(--curb-dim);font-size:12px;padding:6px 10px;background:rgba(36,40,45,.9);border:1px solid var(--asphalt-line);border-radius:5px}
#saveNote:empty{display:none}

#tools{position:absolute;right:var(--gr);top:78px;bottom:92px;width:132px;overflow-y:auto;padding:8px;
  display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.sizes{display:flex;gap:3px;margin:0 0 6px}
.szb{flex:1;background:var(--asphalt-2);border:1px solid var(--asphalt-line);border-radius:4px;padding:4px 0;font:600 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--curb-dim)}
.szb[aria-pressed="true"]{border-color:var(--paint);color:var(--paint)}
.grp h3{margin:0 0 6px;font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--curb-dim)}
.grp .row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;
  height:62px;padding:3px 2px 4px;background:var(--asphalt-2);border:1px solid var(--asphalt-line);border-radius:5px;
  font:600 10.5px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.tool img{width:40px;height:40px;object-fit:contain;display:block;pointer-events:none}
.tool svg{width:30px;height:30px;margin-bottom:4px;pointer-events:none}
.tool:hover{background:#3a4047}
.tool[aria-pressed="true"]{background:var(--paint);border-color:var(--paint);color:var(--paint-ink)}
.tool kbd{position:absolute;top:2px;left:4px;font:600 9px/1 var(--display);color:var(--curb-dim)}
.tool[aria-pressed="true"] kbd{color:var(--paint-ink)}
.tool .cost{position:absolute;top:2px;right:4px;font:600 9px/1 var(--display);color:var(--paint)}
.tool[aria-pressed="true"] .cost{color:var(--paint-ink)}

#timepanel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 12px;display:flex;gap:12px;align-items:center;
  flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 2*16px)}
#timepanel .lbl{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--curb-dim)}
#timepanel .clock{font:700 22px/1 var(--display);min-width:3.4ch;text-align:center;color:var(--paint)}
.chips{display:flex;gap:4px}
.chip{background:var(--asphalt-2);border:1px solid var(--asphalt-line);border-radius:4px;padding:6px 10px;
  font:600 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.chip:hover{background:#3a4047}
.chip[aria-pressed="true"]{border-color:var(--paint);color:var(--paint)}
#hourRange{width:150px;accent-color:var(--paint)}

#advice{position:absolute;right:calc(var(--gr) + 142px);top:78px;width:262px;max-height:calc(100% - 180px);overflow-y:auto;padding:8px 10px 10px;scrollbar-width:thin}
#advice h3{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--curb-dim)}
#advice h3 button{background:none;border:0;color:var(--curb-dim);font:600 11px/1 var(--display);letter-spacing:.08em;cursor:pointer;padding:2px 4px}
#advice.min ol{display:none}
#advice ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#advice li{display:block;width:100%;text-align:left;background:var(--asphalt-2);border:1px solid var(--asphalt-line);border-left:3px solid var(--paint);border-radius:5px;padding:6px 8px;cursor:pointer;color:var(--curb)}
#advice li.warn{border-left-color:var(--bad)}
#advice li.ok{border-left-color:#5fbf6a;cursor:default}
#advice li:hover{border-color:var(--paint)}
#advice .do{display:block;font:600 12.5px/1.25 var(--body)}
#advice .then{display:block;margin-top:3px;font:500 12px/1.25 var(--body);color:var(--curb-dim)}
#advice .then b{color:#8fe39a;font-weight:600}
@media (max-width:1100px){#advice{width:210px}}
@media (max-width:760px){#advice{display:none}}
#status{position:absolute;left:var(--gl);bottom:70px;padding:6px 12px;font:500 13px/1.2 var(--body);
  display:flex;gap:12px;align-items:center;pointer-events:none;max-width:calc(100% - 200px)}
#status b{font:700 15px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--paint)}
#status .bad{color:var(--bad)}
#toast{position:absolute;top:84px;left:50%;transform:translateX(-50%);padding:9px 16px;font:600 16px/1 var(--display);
  letter-spacing:.05em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none;color:var(--curb)}
#toast.show{opacity:1}
#boltLabels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bl{position:absolute;left:0;top:0;padding:1px 6px;border-radius:9px;background:rgba(30,34,40,.9);border:1px solid #ffb800;color:#ffc933;
  font:700 12px/1.3 var(--display);letter-spacing:.04em;white-space:nowrap;will-change:transform}
#modal .currow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#modal .curlbl{font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
#modal .segs{display:flex;gap:6px;flex-wrap:wrap}
#modal .btn.seg.on{border-color:var(--paint);color:var(--paint)}
#modal .rates{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px}
#modal .rates input{width:84px;background:#181b1f;color:var(--curb);border:1px solid var(--asphalt-line);border-radius:5px;padding:6px 8px;font:inherit;-webkit-user-select:text;user-select:text}
#modal .ratenote{font-size:12.5px;margin-top:6px}
#tip{position:fixed;z-index:20;max-width:230px;padding:9px 11px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
#tip b{font:700 16px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase}
#tip span{font-size:13px;line-height:1.35;color:var(--curb-dim)}
#tip i{font-style:normal;color:var(--paint);font-weight:600}
#toast.bad{border-color:var(--bad);color:var(--bad)}

#modal{position:absolute;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:5}
#modal .box{width:min(560px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#modal .box.wide{width:min(760px,100%)}
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mapc{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;background:var(--asphalt-2);border:2px solid var(--asphalt-line);border-radius:6px;color:var(--curb);text-align:left;cursor:pointer}
.mapc canvas{width:100%;aspect-ratio:1;border-radius:4px;image-rendering:pixelated;display:block}
.mapc b{font:700 14px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.mapc small{font:500 11.5px/1.25 var(--body);color:var(--curb-dim)}
.mapc.on{border-color:var(--paint)}.mapc.on b{color:var(--paint)}
@media (max-width:560px){.mapgrid{grid-template-columns:repeat(2,1fr)}}
#modal h2{margin:0;font:700 26px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
#modal p{margin:0;color:var(--curb-dim);line-height:1.45;font-size:14px}
#modal textarea{width:100%;box-sizing:border-box;height:110px;background:#181b1f;color:var(--curb);border:1px solid var(--asphalt-line);
  border-radius:5px;padding:8px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;resize:vertical;
  -webkit-user-select:text;user-select:text}
#modal .actions{display:flex;gap:8px;flex-wrap:wrap}
#modal .msg{min-height:1.2em;font-size:13px;color:var(--ok)}
#modal .msg.bad{color:var(--bad)}
#modal .bt{width:100%;border-collapse:collapse;font-size:15px}
#modal .bt td{padding:6px 2px;border-bottom:1px solid var(--asphalt-line)}
#modal .bt td:last-child{text-align:right;font-weight:600}
#modal .bt .tot td{border-bottom:0;font:700 20px/1.2 var(--display);letter-spacing:.04em;padding-top:10px}
#modal .pos{color:var(--ok)}#modal .neg{color:var(--bad)}
#modal .taxrow{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
#modal .taxrow input{flex:1}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.keys dt{font:700 14px/1.3 var(--display);letter-spacing:.06em;color:var(--paint);text-transform:uppercase;white-space:nowrap}
.keys dd{margin:0;color:var(--curb);line-height:1.3}

#loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:var(--asphalt);
  font:700 28px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--paint);z-index:9}
#loading[hidden]{display:none}

@media (max-width:760px){
  #tools{top:auto;bottom:88px;left:var(--gl);right:var(--gr);width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:14px;padding:6px}
  .grp .row{display:flex}
  .tool{width:60px;flex:none}
  #timepanel{left:var(--gl);right:var(--gr);transform:none;width:auto;max-width:none;bottom:10px}
  #hourRange,#btnFollow,#btnGrid,#btnShadow,#btnTraffic,#btnPol,#sndVol{display:none}
  #status{display:none}
  .stat{min-width:66px;padding:5px 10px}
  #topbar{gap:6px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <canvas id="gl" tabindex="0" aria-label="Şehir haritası"></canvas>
  <div id="boltLabels" aria-hidden="true"></div>
  <div id="hud">
    <div id="topbar">
      <label id="nameBox" class="panel"><small><span class="brand">Şehrim</span> · şehir adı</small><input id="cityName" maxlength="24" value="Yeni Şehir" aria-label="Şehir adı" autocomplete="off"></label>
      <div class="stat panel money"><small>Para</small><b class="num" id="stMoney">₺0</b></div>
      <div class="stat panel"><small>Gün</small><b class="num" id="stDay">1</b></div>
      <div class="stat panel" id="popBox" title="Nüfus / konut kapasitesi"><small>Nüfus</small><b class="num" id="stPop">0</b></div>
      <div class="stat panel" id="powBox" title="Elektrik üretimi / talep"><small>Enerji</small><b class="num" id="stPow">0/0</b></div>
      <div class="stat panel" id="watBox" title="Su üretimi / talep"><small>Su</small><b class="num" id="stWat">0/0</b></div>
      <div class="stat panel"><small>Bina</small><b class="num" id="stBld">0</b></div>
      <div class="stat panel"><small>Yol</small><b class="num" id="stRoad">0</b></div>
      <div class="stat panel opt"><small>Araç</small><b class="num" id="stCar">0</b></div>
      <div class="stat panel opt"><small>Yaya</small><b class="num" id="stPed">0</b></div>
      <div class="spacer"></div>
      <span id="saveNote" class="num"></span>
      <div class="btnrow panel">
        <button class="btn" id="btnBudget" title="Bütçe (B)">Bütçe</button>
        <button class="btn" id="btnSave" title="Kaydet (Ctrl+S)">Kayıt</button>
        <button class="btn" id="btnNew" title="Yeni şehir">Yeni</button>
        <button class="btn" id="btnHelp" title="Yardım (H)">?</button>
      </div>
    </div>

    <nav id="tools" class="panel" aria-label="Araçlar"></nav>
    <aside id="advice" class="panel" aria-label="Öneriler"><h3><span>Öneriler</span><button id="advMin" type="button" aria-label="Önerileri gizle">gizle</button></h3><ol id="advList"></ol></aside>

    <div id="status" class="panel"><span id="stTool"></span><span id="stTile" class="num"></span></div>

    <div id="timepanel" class="panel">
      <span class="lbl">Işık</span>
      <div class="chips" id="presets"></div>
      <input type="range" id="hourRange" min="0" max="24" step="0.25" value="13" aria-label="Günün saati">
      <span class="clock num" id="lightClock">13:00</span>
      <button class="chip" id="btnFollow" aria-pressed="false" title="Işık oyun saatini takip eder">Saati izle</button>
      <button class="chip" id="btnTraffic" aria-pressed="true" title="Trafik (T)">Trafik</button>
      <button class="chip" id="btnGrid" aria-pressed="false" title="Izgara (G)">Izgara</button>
      <button class="chip" id="btnSnd" aria-pressed="true" title="Ses aç / kapat">Ses</button>
      <input type="range" id="sndVol" min="0" max="1" step="0.05" value="0.6" aria-label="Ses seviyesi" title="Ses seviyesi">
      <button class="chip" id="btnPol" aria-pressed="false" title="Kirlilik haritası (O)">Kirlilik</button>
      <button class="chip" id="btnShadow" aria-pressed="true" title="Gölgeler">Gölge</button>
    </div>

    <div id="tip" class="panel" role="tooltip" hidden></div>
    <div id="toast" class="panel" role="status" aria-live="polite"></div>
  </div>

  <div id="modal" hidden></div>
  <div id="loading"><b class="brand">Şehrim</b><span>Şehir yükleniyor…</span></div>
</div>
